<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ludo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        #container {
            width: 25%;
            margin: 20px auto;
            border: solid black 1px;
        }
        .ludo {
            width: 100%;
            display: flex;
            justify-content: space-between;
            height: 133px;
        }
        .frame {
            border: solid black 1px;
            width: 40%;
        }
        .seats {
            border: solid black 1px;
            margin: 23px auto;
            width: 45%;
            height: 80px;
            border-radius: 10px;
        }
        .road {
            border: solid black 1px;
            height: 65px;
        }
        .roads {
            height: 65px;
        }
        .green {
            background: green;
            border-bottom: none;
            border-left: none;
            border-top:none ;
        }
        .red {
            background: red;
            border-right: none;
            border-top: none;
            border-left: none;
        }
        .yellow {
            background: rgb(233, 233, 10);
            border-bottom: none;
            border-left: none;
            border-top: none;
            border-right: none;
        }
        .blue {
            background: rgb(72, 72, 228);
            border-bottom: none;
            border-left: none;
        }
        .white {
            background: whitesmoke;
        }
        .lines {
            border: solid black 1px;
            height: 22px;
            display: flex;
        }
        .squares {
            width: 35px;
            border: solid black 1px;
        }
        .border-tp {
            border-top: none;
            border-bottom: none;
            border-left: none;
        }
        .square {
            border: solid black 1px;
            width: 29px;
            height: 21px;
            
        }
        .bg-dice {
            background: url(./img/messi.jpeg);
            background-size: cover;
            height: 100%;
            width: 100%;
            background-position: center;
        }
    </style>
</head>
<body>
    <div id="container">
        <div class="ludo">
            <div class="frame green">

                        <div class="four-seats green" style="border-radius: 100%; width: 20px;height: 20px;"></div>

            <div class="roads">

                    <span style="padding-left: 5px;">

                </div>
            </div>
        </div>
